name: Défausser

# Défausse les cartes « à classer » (+1 wikibidou chacune, définitif), en deux exécutions :
#   1. lancer sans rien remplir → aperçu dans le résumé du job, avec le nombre et le code ;
#   2. relancer avec ce nombre et ce code → défausse, seulement si la liste n'a pas changé.
on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre de cartes de l'aperçu (vide = aperçu)"
        required: false
        default: ''
      code:
        description: "Code de confirmation de l'aperçu (vide = aperçu)"
        required: false
        default: ''
      etiquette:
        description: "Étiquette à défausser"
        required: false
        default: 'à classer'

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  defausser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Jeton de session de l'exécution précédente (chiffré avec WM_KEY).
      - uses: actions/cache/restore@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}
          restore-keys: wm-session-
      - name: ${{ inputs.nombre == '' && 'Aperçu' || 'Défausse' }}
        env:
          WM_REFRESH_TOKEN: ${{ secrets.WM_REFRESH_TOKEN }}
          WM_KEY: ${{ secrets.WM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          NOMBRE: ${{ inputs.nombre }}
          CODE: ${{ inputs.code }}
          ETIQUETTE: ${{ inputs.etiquette }}
        run: node src/defausser.js --nombre "$NOMBRE" --code "$CODE" --etiquette "$ETIQUETTE"
      # Le jeton vient d'être remplacé par Supabase : on garde le nouveau, même si la suite a échoué.
      - if: always() && hashFiles('.session/jeton.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}-${{ github.run_attempt }}
