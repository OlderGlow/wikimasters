name: Défausser

# Défausse les cartes « à classer » (+1 wikibidou chacune, définitif) dès le lancement.
# La liste des cartes défaussées s'affiche dans le résumé du job.
on:
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien défausser)"
        type: boolean
        default: false
      etiquette:
        description: "Étiquette à défausser"
        required: false
        default: 'à classer'

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  defausser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Jeton de session de l'exécution précédente (chiffré avec WM_KEY).
      - uses: actions/cache/restore@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}
          restore-keys: wm-session-
      - name: ${{ inputs.apercu && 'Aperçu' || 'Défausse' }}
        env:
          WM_REFRESH_TOKEN: ${{ secrets.WM_REFRESH_TOKEN }}
          WM_KEY: ${{ secrets.WM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APERCU: ${{ inputs.apercu && '--apercu' || '' }}
          ETIQUETTE: ${{ inputs.etiquette }}
        run: node src/defausser.js --etiquette "$ETIQUETTE" $APERCU
      # Le jeton vient d'être remplacé par Supabase : on garde le nouveau, même si la suite a échoué.
      - if: always() && hashFiles('.session/jeton.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}-${{ github.run_attempt }}
