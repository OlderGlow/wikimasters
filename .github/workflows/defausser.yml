name: Défausser

# Défausse les cartes « à classer » (+1 wikibidou chacune, définitif) dès le lancement.
# La liste des cartes défaussées s'affiche dans le résumé du job.
on:
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien défausser)"
        type: boolean
        default: false
      etiquette:
        description: "Étiquette à défausser"
        required: false
        default: 'à classer'

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  defausser:
    runs-on: ubuntu-latest
    env:
      ETIQUETTE: ${{ inputs.etiquette }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wm
        with:
          script: src/defausser.js
          args: ${{ inputs.apercu && '--apercu' || '' }}
          step-name: ${{ inputs.apercu && 'Aperçu' || 'Défausse' }}
          refresh-token: ${{ secrets.WM_REFRESH_TOKEN }}
          key: ${{ secrets.WM_KEY }}
          github-token: ${{ github.token }}
