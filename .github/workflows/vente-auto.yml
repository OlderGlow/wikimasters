name: Vente auto

# Toutes les 3 h : remplit les places d'enchère libres avec des cartes C, PC ou R tirées au hasard,
# pour 30 min, à 80 % du prix moyen, 40 enchères par jour au plus.
# Pour l'arrêter : Settings → Secrets and variables → Actions → Variables, créer VENTE_AUTO = off.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien mettre en vente)"
        type: boolean
        default: false

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  vente:
    if: vars.VENTE_AUTO != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wm
        with:
          script: src/vente-auto.js
          args: ${{ inputs.apercu && '--apercu' || '' }}
          step-name: Vente auto
          refresh-token: ${{ secrets.WM_REFRESH_TOKEN }}
          key: ${{ secrets.WM_KEY }}
          github-token: ${{ github.token }}
