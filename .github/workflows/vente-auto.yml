name: Vente auto

# Toutes les 3 h : remplit les places d'enchère libres avec des cartes C, PC ou R tirées au hasard,
# pour 30 min, à 80 % du prix moyen, 40 enchères par jour au plus.
# Pour l'arrêter : Settings → Secrets and variables → Actions → Variables, créer VENTE_AUTO = off.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien mettre en vente)"
        type: boolean
        default: false

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  vente:
    if: vars.VENTE_AUTO != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Jeton de session et état de la vente auto (compteur du jour, prix), de l'exécution précédente.
      - uses: actions/cache/restore@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}
          restore-keys: wm-session-
      - name: Vente auto
        env:
          WM_REFRESH_TOKEN: ${{ secrets.WM_REFRESH_TOKEN }}
          WM_KEY: ${{ secrets.WM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APERCU: ${{ inputs.apercu && '--apercu' || '' }}
        run: node src/vente-auto.js $APERCU
      - if: always() && hashFiles('.session/jeton.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}-${{ github.run_attempt }}
