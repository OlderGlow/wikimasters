name: Vendre les doublons

# Met aux enchères les exemplaires en trop, au prix moyen de leurs ventes passées, dans la limite des places libres.
# La liste des cartes mises en vente s'affiche dans le résumé du job.
on:
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien mettre en vente)"
        type: boolean
        default: false
      duree:
        description: "Durée des enchères (minutes)"
        type: choice
        options: ['720', '360', '180', '60', '30', '10']
        default: '720'
      tous:
        description: "Inclure les doublons jamais vendus (mise 1)"
        type: boolean
        default: false

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  vendre:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Jeton de session de l'exécution précédente (chiffré avec WM_KEY).
      - uses: actions/cache/restore@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}
          restore-keys: wm-session-
      - name: ${{ inputs.apercu && 'Aperçu' || 'Mise en vente' }}
        env:
          WM_REFRESH_TOKEN: ${{ secrets.WM_REFRESH_TOKEN }}
          WM_KEY: ${{ secrets.WM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APERCU: ${{ inputs.apercu && '--apercu' || '' }}
          DUREE: ${{ inputs.duree }}
          TOUS: ${{ inputs.tous && '--tous' || '' }}
        run: node src/vendre.js --duree "$DUREE" $TOUS $APERCU
      # Le jeton vient d'être remplacé par Supabase : on garde le nouveau, même si la suite a échoué.
      - if: always() && hashFiles('.session/jeton.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}-${{ github.run_attempt }}
