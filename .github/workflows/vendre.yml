name: Vendre les doublons

# Met aux enchères les exemplaires en trop, au prix moyen de leurs ventes passées, dans la limite des places libres.
# La liste des cartes mises en vente s'affiche dans le résumé du job.
# Une fois par jour, entre deux passages de Vente auto (:23 toutes les 3 h), avec des enchères d'1 h
# terminées avant le passage suivant. Pour l'arrêter : variable VENTE_DOUBLONS = off.
on:
  schedule:
    - cron: '53 13 * * *' # vers 14 h 53 (heure de Paris en hiver)
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien mettre en vente)"
        type: boolean
        default: false
      duree:
        description: "Durée des enchères (minutes)"
        type: choice
        options: ['720', '360', '180', '60', '30', '10']
        default: '720'
      tous:
        description: "Inclure les doublons jamais vendus (mise 1)"
        type: boolean
        default: false

concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  vendre:
    # La variable ne bloque que l'exécution planifiée : un lancement à la main passe toujours.
    if: github.event_name != 'schedule' || vars.VENTE_DOUBLONS != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wm
        with:
          script: src/vendre.js
          args: --duree ${{ inputs.duree || '60' }} ${{ inputs.tous && '--tous' || '' }} ${{ inputs.apercu && '--apercu' || '' }}
          step-name: ${{ inputs.apercu && 'Aperçu' || 'Mise en vente' }}
          refresh-token: ${{ secrets.WM_REFRESH_TOKEN }}
          key: ${{ secrets.WM_KEY }}
          github-token: ${{ github.token }}
