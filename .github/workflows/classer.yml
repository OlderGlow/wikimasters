name: Classer

# Étiquette les nouvelles cartes sans étiquette, chaque jour et à la demande.
on:
  # GitHub retarde souvent ses horaires d'une à deux heures, et en saute parfois. Plusieurs créneaux par jour
  # garantissent au moins un passage ; les suivants sont sans risque : seules les cartes encore sans étiquette
  # sont traitées (quelques requêtes s'il n'y en a pas).
  schedule:
    - cron: '17 5 * * *'  # vers 6 h 17 (heure de Paris en hiver)
    - cron: '47 10 * * *' # vers 11 h 47
    - cron: '17 16 * * *' # vers 17 h 17
    - cron: '47 20 * * *' # vers 21 h 47
  workflow_dispatch:
    inputs:
      apercu:
        description: "Aperçu seulement (ne rien écrire)"
        type: boolean
        default: false

# Une seule commande WikiMasters à la fois, pour rester discret.
concurrency:
  group: wikimasters
  cancel-in-progress: false

permissions:
  contents: write # branche « etat » : jeton de session chiffré
  issues: write   # alerte si la session expire

jobs:
  classer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Jeton de session de l'exécution précédente (chiffré avec WM_KEY).
      - uses: actions/cache/restore@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}
          restore-keys: wm-session-
      - run: node test/cases.js
      - name: Classer
        env:
          WM_REFRESH_TOKEN: ${{ secrets.WM_REFRESH_TOKEN }}
          WM_KEY: ${{ secrets.WM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          APERCU: ${{ inputs.apercu && '--apercu' || '' }}
        run: node src/classer.js $APERCU
      # Le jeton vient d'être remplacé par Supabase : on garde le nouveau, même si la suite a échoué.
      - if: always() && hashFiles('.session/jeton.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .session
          key: wm-session-${{ github.run_id }}-${{ github.run_attempt }}
